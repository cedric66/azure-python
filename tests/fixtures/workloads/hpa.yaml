apiVersion: v1
kind: List
items:
  # Guards the singleton false positive: report-worker has replicas: 1 in its
  # spec but the HPA floor is 2, so it is not a singleton.
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: report-worker
      namespace: team-b
    spec:
      minReplicas: 2
      maxReplicas: 8
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: report-worker
      metrics:
        - type: Resource
          resource:
            name: cpu
            target: {type: Utilization, averageUtilization: 70}
    status:
      currentReplicas: 2
      desiredReplicas: 2
