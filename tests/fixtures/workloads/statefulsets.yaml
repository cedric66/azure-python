apiVersion: v1
kind: List
items:
  # StatefulSet with a RWO volumeClaimTemplate, tolerating spot: node loss means a
  # multi-minute Azure Disk detach/attach before the replacement pod can start.
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: ledger-db
      namespace: team-a
      labels: {app: ledger-db}
    spec:
      replicas: 1
      serviceName: ledger-db
      selector:
        matchLabels: {app: ledger-db}
      template:
        metadata:
          labels: {app: ledger-db}
        spec:
          terminationGracePeriodSeconds: 60
          tolerations:
            - key: kubernetes.azure.com/scalesetpriority
              operator: Equal
              value: spot
              effect: NoSchedule
          containers:
            - name: db
              image: registry.example.com/ledger-db:14.2
              volumeMounts:
                - name: data
                  mountPath: /var/lib/data
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: managed-csi
            resources:
              requests: {storage: 64Gi}
